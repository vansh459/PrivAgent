<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivAgent</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>PrivAgent</h1>
      <p class="tagline">Local perception, local redaction, remote reasoning.</p>
    </header>

    <form id="task-form">
      <label for="task">Task</label>
      <input
        id="task"
        name="task"
        type="text"
        placeholder="e.g. click the download report link"
        required
      />
      <button type="submit" id="run">Run task</button>
    </form>

    <section id="summary" hidden>
      <h2>Privacy summary</h2>
      <dl id="summary-list"></dl>
    </section>

    <section id="trace" hidden>
      <h2>Audit trail</h2>
      <ol id="trace-list"></ol>
    </section>

    <p id="status" role="status" data-state="idle">Ready.</p>

    <details id="settings">
      <summary>Settings</summary>
      <label for="server">Reasoner URL</label>
      <input id="server" type="url" />
      <button type="button" id="save-server">Save</button>
      <p class="tagline">
        <a id="open-diagnostics" href="./diagnostics.html" target="_blank" rel="noreferrer"
          >Perception diagnostics</a
        >
        � which local inference backends this device can run.
      </p>
    </details>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
