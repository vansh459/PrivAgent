<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivAgent</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>

  <body>
    <header class="app-bar">
      <div class="app-bar__inner">
        <h1>PrivAgent</h1>
        <p class="tagline">Local perception, local redaction, remote reasoning.</p>
      </div>
      <!-- A toolbar popup dies on any focus loss; this reopens the same page as its own
           window, which stays until closed. Hidden when already detached. -->
      <button
        type="button"
        id="detach"
        class="button"
        title="Open as a window that stays until you close it"
      >
        ⧉ Keep open
      </button>
    </header>

    <main class="stack">
      <form id="task-form" class="card">
        <div class="field">
          <label for="task">Task</label>
          <input
            id="task"
            name="task"
            type="text"
            placeholder="e.g. click the download report link"
            required
          />
        </div>
        <label class="field field--inline" for="multi-step">
          <input id="multi-step" name="multi-step" type="checkbox" />
          Multi-step (agent keeps going until the task is done, max 15 steps)
        </label>
        <button type="submit" id="run" class="button button--primary button--block">
          Run task
        </button>
        <button type="button" id="stop" class="button button--block" hidden>Stop</button>
      </form>

      <section id="summary" class="card" hidden>
        <h2>Privacy summary</h2>
        <!--
          Flat by contract: four browser suites read `#summary-list > *` pairwise as
          label/value, so nothing may be wrapped around a row.
        -->
        <dl id="summary-list"></dl>
      </section>

      <section id="trace" class="card" hidden>
        <div class="card__header">
          <h2>Audit trail</h2>
          <button
            type="button"
            id="export-trace"
            class="button button--subtle"
            title="Export audit trail as JSON"
          >
            Download JSON
          </button>
        </div>
        <ol id="trace-list"></ol>
      </section>

      <!-- The transparency panel: the EXACT payload that crossed the wire, tokens and
           all. Withheld elements are shown as a count only - withheld means withheld. -->
      <section id="sent" class="card" hidden>
        <div class="card__header">
          <h2>What left this device (redacted)</h2>
          <button
            type="button"
            id="copy-sent"
            class="button button--subtle"
            title="Copy sanitized wire payload to clipboard"
          >
            📋 Copy JSON
          </button>
        </div>
        <div id="sent-list"></div>
      </section>

      <p id="status" role="status" data-state="idle">Ready.</p>

      <details id="settings" class="card">
        <summary>Settings</summary>
        <div class="settings-body">
          <div class="field">
            <label for="server">Reasoner URL</label>
            <input id="server" type="url" />
          </div>
          <button type="button" id="save-server" class="button">Save</button>
          <p class="tagline">
            <a id="open-diagnostics" href="./diagnostics.html" target="_blank" rel="noreferrer"
              >Perception diagnostics</a
            >
            — which local inference backends this device can run.
          </p>
        </div>
      </details>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
